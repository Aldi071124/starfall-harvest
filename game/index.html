<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfall Harvest</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1030; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #wrap { width: min(960px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #0b1030; }
  #hint { color: #b9b3d9; font: 13px system-ui, sans-serif; text-align: center; padding: 8px 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">Move: mouse or arrow keys / A D &nbsp;•&nbsp; Enter to start &nbsp;•&nbsp; R to restart &nbsp;•&nbsp; M to mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
